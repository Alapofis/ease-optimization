data:
  format: movielens_1m
  path: notebooks/movielens_1m/ml-1m/ratings.dat
  min_rating: 4.0
  seed: 42
  validation_ratio: 0.1
  test_ratio: 0.1
  max_users: null
  max_items: null

model:
  reg: 500.0
  top_l: 200
  max_iter: 50
  k_recommend: 20

solver:
  epsilon: 1.0e-3
  block_size: 4
  nystrom_rank: 32
  nystrom_oversample: 5
  residual_recompute_every: 20

runtime:
  output_dir: results
  user_batch_size: 128
  item_batch_size: null
  max_memory_gb: 10.0

selection:
  tau_recall: 0.005
  tau_ndcg: 0.005
  q_min: 0.95
  tie_break: coarser

baselines:
  itemknn_top_k: 100
  als_factors: 64
  als_regularization: 0.01
  als_iterations: 15
  als_alpha: 40.0
